<!-- icon-clear-filters.svg — clear all active filters: funnel with an X strike-through -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#34A85A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- funnel outline (truncated to leave room for X) -->
  <path d="M3 4h18l-7 8v5"/>
  <!-- X mark overlaid on the bottom half of the funnel -->
  <line x1="8" y1="15" x2="14" y2="21"/>
  <line x1="14" y1="15" x2="8"  y2="21"/>
</svg>
