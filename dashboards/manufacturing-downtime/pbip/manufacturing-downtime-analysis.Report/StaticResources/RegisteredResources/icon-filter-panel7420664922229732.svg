     stroke="#34A85A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- funnel outline -->
  <path d="M3 4h18l-7 8v6l-4 2v-8L3 4Z"/>
  <!-- panel lines — representing the filter panel sliding in from the right -->
  <line x1="16" y1="14" x2="21" y2="14"/>
  <line x1="16" y1="17" x2="21" y2="17"/>
  <line x1="16" y1="20" x2="21" y2="20"/>
</svg>
