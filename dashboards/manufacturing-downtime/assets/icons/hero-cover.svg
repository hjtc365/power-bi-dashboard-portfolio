<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Background — theme primary green (#34A85A) -->
  <rect width="1200" height="400" fill="#34A85A"/>
  <rect x="0" y="0" width="540" height="400" fill="#34A85A"/>
  <line x1="548" y1="40" x2="548" y2="360"
        stroke="white" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.25"/>

  <!-- Subtle background grid (right half) -->
  <g opacity="0.10" stroke="white" stroke-width="0.75" fill="none">
    <line x1="560" y1="60"  x2="1160" y2="60"/>
    <line x1="560" y1="140" x2="1160" y2="140"/>
    <line x1="560" y1="220" x2="1160" y2="220"/>
    <line x1="560" y1="300" x2="1160" y2="300"/>
    <line x1="640"  y1="30" x2="640"  y2="370"/>
    <line x1="780"  y1="30" x2="780"  y2="370"/>
    <line x1="920"  y1="30" x2="920"  y2="370"/>
    <line x1="1060" y1="30" x2="1060" y2="370"/>
  </g>

  <!-- Large central gear (right half) — manufacturing metaphor -->
  <g transform="translate(880, 200)" opacity="0.15" fill="white">
    <circle cx="0" cy="0" r="110"/>
    <circle cx="0" cy="0" r="60" fill="#34A85A"/>
    <!-- gear teeth -->
    <rect x="-12" y="-130" width="24" height="30" rx="4"/>
    <rect x="-12" y="100"  width="24" height="30" rx="4"/>
    <rect x="-130" y="-12" width="30" height="24" rx="4"/>
    <rect x="100"  y="-12" width="30" height="24" rx="4"/>
    <rect x="-98"  y="-98" width="24" height="30" rx="4" transform="rotate(45)"/>
    <rect x="-98"  y="68"  width="24" height="30" rx="4" transform="rotate(-45)"/>
    <rect x="68"   y="-98" width="24" height="30" rx="4" transform="rotate(-45)"/>
    <rect x="68"   y="68"  width="24" height="30" rx="4" transform="rotate(45)"/>
  </g>

  <!-- Small secondary gear (overlapping) -->
  <g transform="translate(1060, 130)" opacity="0.12" fill="white">
    <circle cx="0" cy="0" r="55"/>
    <circle cx="0" cy="0" r="28" fill="#34A85A"/>
    <rect x="-7" y="-64" width="14" height="18" rx="3"/>
    <rect x="-7" y="46"  width="14" height="18" rx="3"/>
    <rect x="-64" y="-7" width="18" height="14" rx="3"/>
    <rect x="46"  y="-7" width="18" height="14" rx="3"/>
  </g>

  <!-- Downtime bar chart (left of gears) — downtime by day -->
  <g fill="white" opacity="0.20">
    <rect x="590" y="260" width="40" height="80"  rx="3"/>
    <rect x="645" y="200" width="40" height="140" rx="3"/>
    <rect x="700" y="240" width="40" height="100" rx="3"/>
    <rect x="755" y="150" width="40" height="190" rx="3"/>
    <rect x="810" y="220" width="40" height="120" rx="3"/>
  </g>

  <!-- Trend line — efficiency over time -->
  <polyline
    points="590,270 645,220 700,260 755,170 810,240"
    fill="none" stroke="white" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.70"/>
  <g fill="white" opacity="0.90">
    <circle cx="590" cy="270" r="5"/>
    <circle cx="645" cy="220" r="5"/>
    <circle cx="700" cy="260" r="5"/>
    <circle cx="755" cy="170" r="5"/>
    <circle cx="810" cy="240" r="5"/>
  </g>
  <circle cx="755" cy="170" r="14"
          fill="none" stroke="white" stroke-width="2" opacity="0.55"/>

  <!-- Factory outline (bottom right) -->
  <g fill="white" opacity="0.08">
    <rect x="1000" y="260" width="140" height="90"/>
    <polygon points="1000,260 1040,220 1080,260"/>
    <polygon points="1060,260 1100,220 1140,260"/>
    <rect x="1030" y="280" width="20" height="70"/>
    <rect x="1070" y="280" width="20" height="70"/>
    <rect x="1110" y="280" width="25" height="70"/>
  </g>
</svg>
