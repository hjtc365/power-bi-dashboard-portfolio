<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A442"/>
      <stop offset="100%" style="stop-color:#D4832A"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <!-- Filter funnel (solid white fill = active/selected) -->
  <path d="M8,22 H50 L35,36 V52 H23 V36 Z"
        fill="white" opacity="0.92"/>
  <!-- Clear badge (orange circle matching bg, white X) -->
  <circle cx="46" cy="17" r="9" fill="#F4A442"/>
  <circle cx="46" cy="17" r="9" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="41" y1="12" x2="51" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="51" y1="12" x2="41" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
