<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F3864"/>
      <stop offset="100%" style="stop-color:#2A4A7F"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#navyGrad)"/>

  <!-- Mini KPI cards (3 stacked, offset to suggest a dashboard) -->
  <rect x="11" y="14" width="30" height="9" rx="2" fill="#9DC3E6" opacity="0.45"/>
  <rect x="11" y="14" width="19" height="9" rx="2" fill="#9DC3E6" opacity="0.7"/>

  <!-- Bar chart bars (ascending) -->
  <rect x="12" y="38" width="7"  height="13" rx="1.5" fill="#9DC3E6" opacity="0.6"/>
  <rect x="22" y="32" width="7"  height="19" rx="1.5" fill="#00B0F0" opacity="0.85"/>
  <rect x="32" y="26" width="7"  height="25" rx="1.5" fill="#00B0F0"/>
  <rect x="42" y="19" width="7"  height="32" rx="1.5" fill="#1EC8F5"/>

  <!-- Trend line over bars -->
  <polyline
    points="15,37 25,31 35,25 45,18"
    fill="none"
    stroke="#92D050"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Trend dots -->
  <circle cx="15" cy="37" r="2.5" fill="#92D050"/>
  <circle cx="25" cy="31" r="2.5" fill="#92D050"/>
  <circle cx="35" cy="25" r="2.5" fill="#92D050"/>
  <circle cx="45" cy="18" r="2.5" fill="#92D050"/>
</svg>
