<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#29AB87"/>
      <stop offset="100%" style="stop-color:#1A8060"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#tealGrad)"/>

  <!-- Slider track 1 (top) -->
  <line x1="13" y1="22" x2="51" y2="22" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- Slider fill 1 -->
  <line x1="13" y1="22" x2="36" y2="22" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Slider thumb 1 -->
  <circle cx="36" cy="22" r="6" fill="white"/>
  <circle cx="36" cy="22" r="3" fill="#29AB87"/>

  <!-- Slider track 2 (middle) -->
  <line x1="13" y1="37" x2="51" y2="37" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- Slider fill 2 -->
  <line x1="13" y1="37" x2="24" y2="37" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Slider thumb 2 -->
  <circle cx="24" cy="37" r="6" fill="white"/>
  <circle cx="24" cy="37" r="3" fill="#29AB87"/>

  <!-- Delta arrow (bottom right — "impact" symbol) -->
  <path d="M41,47 L49,53 L33,53 Z"
    fill="#92D050"
    stroke="none"/>
</svg>
