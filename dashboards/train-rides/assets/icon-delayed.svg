<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A442"/>
      <stop offset="100%" style="stop-color:#D4832A"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#orangeGrad)"/>
  <!-- Clock face -->
  <circle cx="32" cy="32" r="20" fill="white" opacity="0.95"/>
  <!-- Hour markers (4 cardinal) -->
  <line x1="32" y1="14" x2="32" y2="17" stroke="#D4832A" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="50" stroke="#D4832A" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="17" y2="32" stroke="#D4832A" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="50" y2="32" stroke="#D4832A" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~10) -->
  <line x1="32" y1="32" x2="22" y2="20" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~3) -->
  <line x1="32" y1="32" x2="44" y2="32" stroke="#F4A442" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#1F3864"/>
  <!-- Alert triangle at bottom -->
  <path d="M32,54 L25,62 L39,62 Z" fill="#F4A442"/>
  <rect x="30.5" y="56" width="3" height="3" rx="0.5" fill="white"/>
  <circle cx="32" cy="61" r="1.5" fill="white"/>
</svg>
