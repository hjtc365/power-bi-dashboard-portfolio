<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F3864"/>
      <stop offset="100%" style="stop-color:#2A4A7F"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="url(#circleBg)"/>

  <!-- Train body — main carriage -->
  <rect x="10" y="30" width="46" height="22" rx="5" fill="#00B0F0"/>
  <!-- Train cab — nose section -->
  <path d="M56,30 L68,34 L70,41 L68,48 L56,52 Z" fill="#00B0F0"/>

  <!-- Body stripe -->
  <rect x="10" y="30" width="58" height="4" rx="2" fill="#9DC3E6" opacity="0.6"/>

  <!-- Windows – body -->
  <rect x="14" y="35" width="9" height="7" rx="2" fill="#EBF3FB" opacity="0.95"/>
  <rect x="26" y="35" width="9" height="7" rx="2" fill="#EBF3FB" opacity="0.95"/>
  <rect x="38" y="35" width="9" height="7" rx="2" fill="#EBF3FB" opacity="0.95"/>

  <!-- Cab windscreen -->
  <path d="M57,33 L66,36 L67,41 L66,46 L57,49 Z" fill="#EBF3FB" opacity="0.9"/>

  <!-- Underbelly / skirt -->
  <rect x="10" y="50" width="60" height="5" rx="2" fill="#4059AC"/>

  <!-- Wheels -->
  <circle cx="22" cy="60" r="6" fill="#1F3864" stroke="#9DC3E6" stroke-width="2"/>
  <circle cx="22" cy="60" r="2.5" fill="#9DC3E6"/>
  <circle cx="42" cy="60" r="6" fill="#1F3864" stroke="#9DC3E6" stroke-width="2"/>
  <circle cx="42" cy="60" r="2.5" fill="#9DC3E6"/>
  <circle cx="60" cy="60" r="6" fill="#1F3864" stroke="#9DC3E6" stroke-width="2"/>
  <circle cx="60" cy="60" r="2.5" fill="#9DC3E6"/>

  <!-- Rail track -->
  <line x1="6" y1="67" x2="74" y2="67" stroke="#9DC3E6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
