<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="perfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B0F0"/>
      <stop offset="100%" style="stop-color:#0078AA"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#perfGrad)"/>

  <!-- Gauge arc background (grey) -->
  <path d="M11,42 A22,22 0 1,1 53,42"
    fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
  <!-- Gauge arc foreground (~81% on-time — sweep ~162° of 180°) -->
  <path d="M11,42 A22,22 0 1,1 46,21"
    fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Needle -->
  <line x1="32" y1="32" x2="46" y2="21" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4" fill="white"/>
  <circle cx="32" cy="32" r="2" fill="#1F3864"/>

  <!-- % text -->
  <text x="32" y="50"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="9"
    font-weight="700"
    fill="white"
    text-anchor="middle">81%</text>
</svg>
