      <stop offset="0%" style="stop-color:#92D050"/>
      <stop offset="100%" style="stop-color:#5BAD2E"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#greenGrad)"/>
  <!-- Inner white ring -->
