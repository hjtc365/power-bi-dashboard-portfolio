<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#29AB87"/>
      <stop offset="100%" style="stop-color:#1A8060"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#tealGrad)"/>

  <!-- Curved route path -->
  <path d="M15,50 Q15,28 32,24 Q49,20 49,14"
    fill="none"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="4,3"
    opacity="0.8"/>

  <!-- Departure circle (bottom left) -->
  <circle cx="15" cy="50" r="6" fill="white"/>
  <circle cx="15" cy="50" r="3" fill="#29AB87"/>

  <!-- Arrival pin (top right) -->
  <path d="M49,5 C43,5 43,13 49,13 C55,13 55,5 49,5 Z" fill="white"/>
  <circle cx="49" cy="10" r="3" fill="#29AB87"/>
  <!-- Pin tail -->
  <line x1="49" y1="13" x2="49" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
