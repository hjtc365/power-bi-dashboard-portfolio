<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F3864"/>
      <stop offset="100%" style="stop-color:#2A4A7F"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#navyGrad)"/>
  <!-- Coin ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00B0F0" stroke-width="2.5" opacity="0.5"/>
  <!-- £ symbol -->
  <text
    x="32" y="43"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    fill="#00B0F0"
    text-anchor="middle">£</text>
</svg>
